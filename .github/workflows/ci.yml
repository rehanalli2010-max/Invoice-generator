name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Run lint (root)
        run: npm run lint 2>/dev/null || echo "No lint script in root"

      - name: Run lint (server)
        run: npm run lint 2>/dev/null || echo "No lint script in server"

      - name: Run typecheck (root)
        run: npm run typecheck 2>/dev/null || echo "No typecheck script in root"

      - name: Run typecheck (server)
        run: npm run typecheck 2>/dev/null || echo "No typecheck script in server"

      - name: Run tests (server)
        run: npm test -- --run
        working-directory: ./server
        env:
          NODE_ENV: test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Run npm audit (server)
        run: npm audit --audit-level=high
        working-directory: ./server
        continue-on-error: true

      - name: Run npm audit (root)
        run: npm audit --audit-level=high
        continue-on-error: true

  dependabot-auto-merge:
    needs: [lint-and-test, security-audit]
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Dependabot auto-merge
        uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-type: "squash"